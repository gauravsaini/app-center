name: backend_rpm
description: RPM backend for the unified *nix store — PackageKit (D-Bus) transport implementing the store_contracts law, with a 5-token-tolerant package-id parser at the transport seam (research D1).
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  dbus: ^0.7.6
  store_contracts:
    path: ../store_contracts

dev_dependencies:
  test: ^1.25.0
